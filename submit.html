<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Submitter</title>
    <script src="https://www.google.com/recaptcha/api.js?render=6LelWXkrAAAAACAaeeBfBlosh9MlzcKRJ2zNA82T"></script>
    <script src="https://cdn.jsdelivr.net/npm/nsfwjs@latest/dist/nsfwjs.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="submit.css">
    <script src="submit.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1461308207165881"
     crossorigin="anonymous"></script>
</head>
<body>
    <div class="main_container">
    <h2>Submit an Image</h2>
        <form id="upload-form">
            <input type="file" id="image-file" accept="image/jpeg, image/png">
            <button type="submit">Submit Image</button>
        </form>
    <div id="status-message"></div>
        <div class="options">
            <button class="option-btn2 btn" onclick="window.open('index.html')">Look at cat pics!</button>
			<div class="option-theme">
				<div class="theme-label">Theme:</div>
				<div class="switch_btn btn">
					<input type="checkbox" class="btn_input" name="toggle" id="toggle" onclick="toggleTheme()">
					<div class="circle">
						<img class="circle-icon light" src="SVGs/cat-light.svg" alt="light mode">
						<img class="circle-icon dark" src="SVGs/cat-dark.svg" alt="dark mode">
					</div>
				</div>
			</div>
        </div>
    </div>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1461308207165881"
    crossorigin="anonymous"></script>
    <!-- Ad -->
    <ins class="adsbygoogle"
        style="display:block"
        data-ad-client="ca-pub-1461308207165881"
        data-ad-slot="1250418783"
        data-ad-format="auto"
        data-full-width-responsive="true"></ins>
    <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

<!-- <div id="toast" class="toast">No previous image!</div> -->
</body>
</html>
