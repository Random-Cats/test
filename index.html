<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIP Rando Cat Site</title>
    <link rel="stylesheet" href="home.css">
    <script src="home.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1461308207165881"
     crossorigin="anonymous"></script>
</head>
<body>
    <div class="main_container">
        <div class="image-box">
            <img id="catImage" src="Cat-Imgs/">
        </div>

        <button class="back-btn btn" id="backButton">Back</button>
        <button class="click-button btn" id="catButton" onclick="handleCatButtonClick()">🎲</button>
        <button class="forward-btn btn" id="forward-btn">Forward</button>
        <!-- <button class="back-btn btn" id="backButton" onclick="printHistoryIndex()">printHistoryIndex</button> -->


        <div class="counter-display">
            <p>Your Clicks: <span id="localClickCounter">0</span></p>
            <p>Global Clicks: <span id="globalClickCounter">0</span></p>
            <p>Total Cat Pics: <span id="total_images">0</span></p>
        </div>
        <div class="options">
            <button class="option-btn btn" onclick="downloadCurrentImage()">Download Image</button>
            <button class="option-btn2 btn" onclick="window.open('submit.html')">Submit a cat pic!</button>
			<div class="option-theme">
				<div class="theme-label">Theme:</div>
				<div class="switch_btn btn">
					<input type="checkbox" class="btn_input" name="toggle" id="toggle" onclick="toggleTheme()">
					<div class="circle">
						<img class="circle-icon light" src="SVGs/cat-light.svg" alt="light mode">
						<img class="circle-icon dark" src="SVGs/cat-dark.svg" alt="dark mode">
					</div>
				</div>
			</div>
        </div>
    </div>
    <button class="option-btn3 btn" onclick="window.open('feedback.html')">Submit feedback</button>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1461308207165881"
    crossorigin="anonymous"></script>
    <!-- Ad -->
    <ins class="adsbygoogle"
        style="display:block"
        data-ad-client="ca-pub-1461308207165881"
        data-ad-slot="1250418783"
        data-ad-format="auto"
        data-full-width-responsive="true"></ins>
    <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

<div id="toast" class="toast">No previous image!</div>
</body>
</html>
