<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIP Rando Cat Site</title>
    <link rel="stylesheet" href="home.css">
    <script src="home.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1461308207165881"
     crossorigin="anonymous"></script>
</head>
<body>
    <div class="main_container">
        <div class="image-box">
            <img id="catImage" src="/Cat-Imgs/" alt="Random Image">
        </div>

        <button class="click-button" id="catButton" onclick="handleCatButtonClick()">Click Me!</button>

        <div class="counter-display">
            <p>Your Clicks: <span id="localClickCounter">0</span></p>
            <p>Global Clicks: <span id="globalClickCounter">0</span></p>
            <p>Total Images: <span id="total_images">0</span></p>
        </div>
        <div>
            <button onclick="downloadCurrentImage()">Download Image</button>
            <button onclick="toggleTheme()">Toggle Theme</button>
        </div>
    </div>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1461308207165881"
    crossorigin="anonymous"></script>
    <!-- Ad -->
    <ins class="adsbygoogle"
        style="display:block"
        data-ad-client="ca-pub-1461308207165881"
        data-ad-slot="1250418783"
        data-ad-format="auto"
        data-full-width-responsive="true"></ins>
    <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

</body>
</html>
